# pyproject.toml
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-data-chatbot"
version = "0.1.0"
description = "AI-powered hospital data chatbot using AWS Bedrock and SageMaker"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "polars>=0.18.0",  # Instead of pandas
    "numpy>=1.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "boto3>=1.28.0",
    "openpyxl>=3.1.2", 
    "fastexcel>=0.7.0" # Still needed for Excel support
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "flake8>=6.0.0",
]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"