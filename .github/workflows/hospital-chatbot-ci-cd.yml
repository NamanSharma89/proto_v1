name: Hospital Data Chatbot CI/CD

on:
  workflow_dispatch: # manual only — all automatic triggers temporarily disabled

# DISABLED TRIGGERS:
# on:
#   push:
#     branches: [main, develop]
#     paths:
#       - 'hospital-data-chatbot/**'
#       - '.github/workflows/hospital-chatbot-ci-cd.yml'
#   pull_request:
#     branches: [main]
#     paths:
#       - 'hospital-data-chatbot/**'
#   workflow_dispatch:
#     inputs:
#       environment:
#         description: 'Environment to deploy to'
#         required: true
#         default: 'dev'
#         type: choice
#         options:
#           - dev
#           - staging
#           - prod

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: hdc-dev-cloud
  WORKING_DIRECTORY: hospital-data-chatbot

permissions:
  id-token: write # Required for OIDC authentication
  contents: read  # Required to checkout the repository

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hospital_data_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install uv
        run: pip install uv
      
      - name: Setup virtual environment
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"
      
      - name: Run linting
        run: |
          source .venv/bin/activate
          flake8 app tests || true
          black --check app tests || true
          isort --check-only app tests || true
      
      - name: Create test data directory
        run: |
          mkdir -p data/raw
          touch data/raw/hospital_data.xlsx
      
      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v || true
        env:
          APP_ENV: dev_local
          DEBUG: True
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: hospital_data_test
          DB_USER: postgres
          DB_PASSWORD: postgres

  build-and-deploy:
    name: Build and Deploy
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Determine environment
        id: environment
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ENV=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ENV=prod" >> $GITHUB_ENV
          else
            echo "ENV=dev" >> $GITHUB_ENV
          fi
      
      # OIDC Authentication with AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-hospital-chatbot-${{ env.ENV }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Create data directories to ensure build works
          mkdir -p data/raw
          touch data/raw/hospital_data.xlsx
          
          # Build Docker image
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}-${{ env.ENV }}:$IMAGE_TAG \
            --build-arg APP_ENV=${{ env.ENV }} \
            .
          
          # Tag as latest
          docker tag $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}-${{ env.ENV }}:$IMAGE_TAG \
                    $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}-${{ env.ENV }}:latest
          
          # Push image to ECR
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}-${{ env.ENV }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}-${{ env.ENV }}:latest
          
          # Store image URI for next steps
          echo "IMAGE_URI=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}-${{ env.ENV }}:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Trigger ECS deployment
        run: |
          # Update ECS service with new task definition revision
          aws ecs update-service \
            --cluster hospital-chatbot-${{ env.ENV }} \
            --service hospital-chatbot-service \
            --force-new-deployment
            
          echo "ECS deployment triggered successfully"